# Configuração do site de documentação da Advocondo
# Referência: https://zensical.org/docs/

[project]
site_name = "Advocondo — Documentação"
site_url = "https://advocondo.github.io/docs/"
site_description = "Documentação de requisitos do sistema de gestão de acordos extrajudiciais"
site_author = "Equipe Advocondo"

copyright = "Copyright &copy; 2026 Advocondo"

repo_url = "https://github.com/Advocondo/docs"
repo_name = "Advocondo/docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Início" = "index.md" },
  { "Histórias de usuário" = [
    { "Visão geral" = "historias/index.md" },
    { "EP01 · Portal & Autenticação" = "historias/ep01-portal-autenticacao.md" },
    { "EP02 · Gestão de Usuários" = "historias/ep02-usuarios-perfis.md" },
    { "EP03 · Cadastro de Acordos" = "historias/ep03-cadastro-acordos.md" },
    { "EP04 · Acompanhamento de Parcelas" = "historias/ep04-parcelas.md" },
    { "EP05 · Comissões e Metas" = "historias/ep05-comissoes-metas.md" },
    { "EP06 · Painel do Cliente" = "historias/ep06-painel-cliente.md" },
  ]},
  { "Rastreabilidade" = [
    { "Matriz de rastreabilidade" = "rastreabilidade/matriz.md" },
  ]},
  { "Design system" = [
    { "Visão geral" = "design-system/index.md" },
    { "Fundamentos" = "design-system/fundamentos.md" },
    { "Componentes" = "design-system/componentes.md" },
    { "Regras e ressalvas" = "design-system/regras.md" },
  ]},
  { "Protótipos" = [
    { "Visão geral" = "prototipos/index.md" },
    { "Cobertura das histórias" = "prototipos/cobertura-historias.md" },
    { "Site institucional" = "prototipos/site-institucional.md" },
    { "Login" = "prototipos/login.md" },
    { "Redefinir Senha" = "prototipos/redefinir-senha.md" },
    { "Painel" = "prototipos/painel.md" },
    { "Acordos" = "prototipos/acordos.md" },
    { "Detalhes do Acordo" = "prototipos/detalhes-do-acordo.md" },
    { "Acompanhamento Mensal" = "prototipos/acompanhamento-mensal.md" },
    { "Condomínios" = "prototipos/condominios.md" },
    { "Metas e Comissões" = "prototipos/metas-e-comissoes.md" },
    { "Trilha de auditoria" = "prototipos/trilha-de-auditoria.md" },
    { "Gestão de Usuários" = "prototipos/gestao-de-usuarios.md" },
    { "Perfil" = "prototipos/perfil.md" },
    { "Sobreposições" = "prototipos/sobreposicoes.md" },
    { "Mobile" = [
      { "Visão geral" = "prototipos/mobile/index.md" },
      { "Site institucional" = "prototipos/mobile/site-institucional.md" },
      { "Login" = "prototipos/mobile/login.md" },
      { "Redefinir senha" = "prototipos/mobile/redefinir-senha.md" },
      { "Painel" = "prototipos/mobile/painel.md" },
      { "Mais" = "prototipos/mobile/mais.md" },
      { "Acordos" = "prototipos/mobile/acordos.md" },
      { "Detalhes do acordo" = "prototipos/mobile/detalhes-do-acordo.md" },
      { "Faturas do mês" = "prototipos/mobile/acompanhamento-mensal.md" },
      { "Condomínios" = "prototipos/mobile/condominios.md" },
      { "Metas e comissões" = "prototipos/mobile/metas-e-comissoes.md" },
      { "Trilha de auditoria" = "prototipos/mobile/trilha-de-auditoria.md" },
      { "Gestão de usuários" = "prototipos/mobile/gestao-de-usuarios.md" },
      { "Meu perfil" = "prototipos/mobile/perfil.md" },
      { "Sobreposições" = "prototipos/mobile/sobreposicoes.md" },
    ]},
  ]},
]

[project.theme]
language = "pt-BR"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Alternar para o modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Alternar para o modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar a preferência do sistema"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Advocondo"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
